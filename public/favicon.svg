<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="wow-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#1E2022" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Carbonation Fizz Bubbles -->
  <circle cx="14" cy="13" r="3.8" fill="#FFFFFF" stroke="#1E2022" stroke-width="2"/>
  <circle cx="15.2" cy="11.8" r="1.2" fill="#7AE2BF"/>
  <circle cx="8" cy="22" r="2.6" fill="#FFDE00" stroke="#1E2022" stroke-width="1.8"/>

  <!-- Playful Sparkling Can (Tilted -6 degrees) -->
  <g transform="rotate(-6 31 37)" filter="url(#wow-shadow)">
    <!-- Pop Tab Ring -->
    <path d="M26 6.5 C26 5 31 5 31 6.5 L30 10.5 L27 10.5 Z" fill="#FFDE00" stroke="#1E2022" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Can Top Rim -->
    <ellipse cx="29" cy="11" rx="11" ry="3.5" fill="#FFFFFF" stroke="#1E2022" stroke-width="2.4"/>
    <ellipse cx="29" cy="11.2" rx="7.5" ry="2" fill="#F3F4F6" stroke="#1E2022" stroke-width="1.2"/>

    <!-- Can Body Outline & Fill -->
    <!-- Base Coral Body -->
    <path d="M18 11.5 L18 49 C18 52.8 40 52.8 40 49 L40 11.5 Z" fill="#FF6B8B" stroke="#1E2022" stroke-width="2.6" stroke-linejoin="round"/>
    
    <!-- Dynamic Sun Yellow Wave Bottom -->
    <path d="M18 31 C24 27 34 37 40 32 L40 49 C40 52.8 18 52.8 18 49 Z" fill="#FFDE00" stroke="#1E2022" stroke-width="2" stroke-linejoin="round"/>
    <!-- Mint Wave Accent Ribbon -->
    <path d="M18 28.5 C23 25 33 34.5 40 30 L40 32 C34 37 24 27 18 31 Z" fill="#7AE2BF"/>

    <!-- Bottom Rim Curve -->
    <path d="M18 48 C18 51.5 40 51.5 40 48" fill="none" stroke="#1E2022" stroke-width="2.2"/>

    <!-- Expressive Playful Eyes -->
    <circle cx="25" cy="21" r="2.6" fill="#1E2022"/>
    <circle cx="25.8" cy="20.2" r="0.9" fill="#FFFFFF"/>
    <circle cx="33" cy="21" r="2.6" fill="#1E2022"/>
    <circle cx="33.8" cy="20.2" r="0.9" fill="#FFFFFF"/>

    <!-- Cute Curved Smile -->
    <path d="M27 25.5 Q29 27.8 31 25.5" fill="none" stroke="#1E2022" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Big Effervescent 4-Point Sparkle Star (Top Right) -->
  <g filter="url(#wow-shadow)">
    <path d="M47 3 C48 10 52.5 14 59.5 15 C52.5 16 48 20 47 27 C46 20 41.5 16 34.5 15 C41.5 14 46 10 47 3 Z" 
          fill="#FFDE00" stroke="#1E2022" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- Sparkle Highlight -->
    <circle cx="47" cy="15" r="2.2" fill="#FFFFFF"/>
  </g>

  <!-- Secondary Mini Sparkle Diamond -->
  <path d="M37 6 C37.5 8.5 39 9.8 41 10 C39 10.5 37.5 11.8 37 14 C36.5 11.8 35 10.5 33 10 C35 9.8 36.5 8.5 37 6 Z" 
        fill="#FFDE00" stroke="#1E2022" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
